<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login internal RuangRasa untuk admin dan penjual.">
    <title>Login | RuangRasa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="logo" href="index.html">Ruang<span>Rasa</span></a>
        <p class="overline">AREA INTERNAL</p>
        <h1>Selamat datang kembali.</h1>
        <p class="auth-intro">Masuk sebagai admin atau penjual untuk melanjutkan.</p>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-dark" type="submit">Masuk →</button>
            <p id="login-error" class="auth-error" role="alert" hidden></p>
        </form>
        <a class="auth-back" href="index.html">← Kembali ke RuangRasa</a>
    </main>
</body>
</html>
